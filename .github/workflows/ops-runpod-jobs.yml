name: RunPod Job Operations

on:
  push:
    branches: [main]
    paths:
      - "runpod_ops_requests/*.json"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_ENDPOINT_ID: dyup1dztjr4u15
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          CHANGED="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
          mapfile -t FILES < <(printf '%s\n' "$CHANGED" | grep -E '^runpod_ops_requests/.+\.json$' || true)
          test "${#FILES[@]}" -eq 1
          REQUEST="${FILES[0]}"
          jq -e '.job_ids | type == "array" and length > 0' "$REQUEST" >/dev/null
          echo "request=$REQUEST" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$REQUEST" .json)" >> "$GITHUB_OUTPUT"

      - name: Inspect or cancel jobs
        shell: bash
        run: |
          set -euo pipefail
          REQUEST='${{ steps.request.outputs.request }}'
          ACTION="$(jq -r '.action // "status"' "$REQUEST")"
          mkdir -p runpod_ops_results
          OUT="runpod_ops_results/${{ steps.request.outputs.name }}.json"
          echo '[]' > "$OUT"
          while IFS= read -r JOB_ID; do
            STATUS_FILE="/tmp/status.json"
            HTTP="$(curl --silent --show-error --output "$STATUS_FILE" --write-out '%{http_code}' --max-time 120 \
              "https://api.runpod.ai/v2/${RUNPOD_ENDPOINT_ID}/status/${JOB_ID}" \
              -H "Authorization: Bearer ${RUNPOD_API_KEY}")"
            if [ "$ACTION" = "cancel" ] && [ "$HTTP" = "200" ]; then
              STATE="$(jq -r '.status // empty' "$STATUS_FILE")"
              case "$STATE" in
                COMPLETED|FAILED|TIMED_OUT|CANCELLED) ;;
                *)
                  curl --fail --silent --show-error --max-time 120 -X POST \
                    "https://api.runpod.ai/v2/${RUNPOD_ENDPOINT_ID}/cancel/${JOB_ID}" \
                    -H "Authorization: Bearer ${RUNPOD_API_KEY}" > /tmp/cancel.json
                  ;;
              esac
            fi
            jq -s --arg id "$JOB_ID" --arg http "$HTTP" \
              '.[0] + [{job_id:$id,http_status:($http|tonumber),response:.[1]}]' \
              "$OUT" "$STATUS_FILE" > /tmp/merged.json
            mv /tmp/merged.json "$OUT"
          done < <(jq -r '.job_ids[]' "$REQUEST")

      - name: Publish result
        shell: bash
        run: |
          set -euo pipefail
          RESULT="runpod_ops_results/${{ steps.request.outputs.name }}.json"
          git config user.name "stemforge-ops"
          git config user.email "stemforge-ops@users.noreply.github.com"
          git add "$RESULT"
          git commit -m "Record RunPod job operation result [skip ci]"
          git push || {
            git pull --rebase --autostash origin main
            git push
          }
