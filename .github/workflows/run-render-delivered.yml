name: Run Render With Delivery

# Renders a full pass and gets the audio off the worker before it shuts down.
#
# The endpoint has no shared network volume: /runpod-volume is container-local,
# so a later job on a different worker cannot read what an earlier one wrote,
# and volume_file_info returns FileNotFoundError minutes after a successful
# render. Fetching outputs afterwards therefore cannot work. The worker instead
# uploads directly to a temporary private GitHub release while it is still
# alive, and this workflow collects those assets and deletes the release.
#
# The release token is injected into the payload at run time and never appears
# in a committed request file.

on:
  workflow_dispatch:
    inputs:
      request_path:
        description: Repository path to one render request JSON
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - "delivery_requests/**/*.json"
      - "full_pass_delivery_requests/**/*.json"

permissions:
  contents: write

concurrency:
  group: stemforge-delivered
  cancel-in-progress: false

jobs:
  render-and-deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUNPOD_ENDPOINT_ID: dyup1dztjr4u15
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve and validate the request
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RUNPOD_API_KEY"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            REQUEST='${{ inputs.request_path }}'
          else
            # Diff against the first parent explicitly. `git diff-tree <sha>`
            # prints nothing at all for a merge commit, so a request arriving
            # by pull request resolved to no files and the run died here with
            # an empty name and no reason. `-m --first-parent` is not the fix
            # either: it splits the merge and also reports files that differ
            # against the second parent, which are not part of this push.
            BASE="$(git rev-parse --verify --quiet "${GITHUB_SHA}^1" || true)"
            if [ -z "$BASE" ]; then
              echo "Cannot resolve ${GITHUB_SHA}^1 - the checkout has no parent commit." >&2
              echo "Raise fetch-depth, or dispatch with request_path instead." >&2
              exit 1
            fi
            mapfile -t REQUESTS < <(
              git diff --name-only "$BASE" "$GITHUB_SHA" \
                | grep -E '^(full_pass_)?delivery_requests/.+\.json$' || true
            )
            if [ "${#REQUESTS[@]}" -ne 1 ]; then
              echo "Expected exactly one request file in $GITHUB_SHA, found ${#REQUESTS[@]}:" >&2
              printf '  %s\n' "${REQUESTS[@]:-(none)}" >&2
              echo "Dispatch this workflow with request_path to render one directly." >&2
              exit 1
            fi
            REQUEST="${REQUESTS[0]}"
          fi

          test -f "$REQUEST"
          ACTION="$(jq -r '.input.action' "$REQUEST")"
          case "$ACTION" in
            full_pass|naturalize|stem_remix|master_audio|master_audio_github_delivery) ;;
            *) echo "Action '$ACTION' has no delivery path." >&2; exit 1 ;;
          esac
          python3 tools/validate_jobs.py "$REQUEST"

          NAME="$(basename "$REQUEST" .json)"
          echo "request=$REQUEST" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"

      - name: Create a temporary private release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          TAG="full-pass-${GITHUB_RUN_ID}"
          RELEASE_ID="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="$TAG" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="Temporary full pass output ${GITHUB_RUN_ID}" \
            -f body='Temporary private container for one full pass. Deleted when the run ends.' \
            -F draft=true -F prerelease=false --jq '.id')"
          test -n "$RELEASE_ID"
          echo "id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Render and export before shutdown
        id: render
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery
          REQUEST='${{ steps.meta.outputs.request }}'
          ACTION='${{ steps.meta.outputs.action }}'
          PAYLOAD="$(mktemp)"

          jq \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson release_id ${{ steps.release.outputs.id }} \
            --arg token "$GH_TOKEN" \
            '.input.github_release_export = {repository:$repository, release_id:$release_id, token:$token}' \
            "$REQUEST" > "$PAYLOAD"

          JOB_ID="$(curl -sS --max-time 120 \
            -X POST "https://api.runpod.ai/v2/${RUNPOD_ENDPOINT_ID}/run" \
            -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
            -H "Content-Type: application/json" \
            --data-binary "@${PAYLOAD}" | jq -r '.id // empty')"
          rm -f "$PAYLOAD"
          test -n "$JOB_ID"
          echo "runpod_job_id=$JOB_ID" | tee delivery/RunPod_Execution.txt
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"

          RESULT="delivery/runpod_result.json"
          TERMINAL=0
          STARTED="$(date +%s)"
          LAST_STATE=""
          # Log every state change. A job sitting IN_QUEUE and a job rendering
          # for an hour look identical from outside, and the difference decides
          # whether to tune the render or wait for the endpoint to free up.
          for _ in $(seq 1 420); do
            sleep 15
            curl -sS --max-time 60 \
              "https://api.runpod.ai/v2/${RUNPOD_ENDPOINT_ID}/status/${JOB_ID}" \
              -H "Authorization: Bearer ${RUNPOD_API_KEY}" > "$RESULT" || continue
            STATE="$(jq -r '.status // empty' "$RESULT")"
            if [ "$STATE" != "$LAST_STATE" ]; then
              echo "[$(( ($(date +%s) - STARTED) / 60 ))m] RunPod status: ${STATE:-unknown}"
              LAST_STATE="$STATE"
            fi
            case "$STATE" in
              COMPLETED|FAILED|TIMED_OUT|CANCELLED) TERMINAL=1; break ;;
            esac
          done

          if [ "$TERMINAL" -ne 1 ]; then
            # This was a bare `test`, so a job that never finished exited 1
            # saying nothing - indistinguishable from a worker error.
            echo "RunPod job $JOB_ID never reached a terminal state." >&2
            echo "  last status: ${LAST_STATE:-never reported}" >&2
            echo "  waited:      $(( ($(date +%s) - STARTED) / 60 )) minutes" >&2
            echo "  A job stuck IN_QUEUE means the endpoint has no free worker," >&2
            echo "  not that this render is slow." >&2
            exit 1
          fi

          # Report what the worker said before failing on it. These checks were
          # silent `jq -e >/dev/null` assertions, so a render that died after
          # six minutes of GPU time exited 1 with no message and the only copy
          # of the reason sat inside an artifact. Three consecutive failures
          # were diagnosed as "something went wrong" for exactly this reason.
          # Named fields only - never the whole document, which is one schema
          # change away from echoing the injected release token into a log.
          if ! jq -e '.status == "COMPLETED"' "$RESULT" >/dev/null; then
            echo "RunPod job $JOB_ID did not complete." >&2
            jq -r '"  status: \(.status // "unknown")\n  error: \(.error // "none")"' \
              "$RESULT" >&2 || true
            exit 1
          fi
          if ! jq -e '.output.status == "completed"' "$RESULT" >/dev/null; then
            echo "The worker rejected or failed this render:" >&2
            for FIELD in status error error_type reason action; do
              echo "  ${FIELD}: $(jq -r ".output.${FIELD} // \"none\"" "$RESULT")" >&2
            done
            exit 1
          fi
          for CHECK in "stemforge_version=2.4.0" "build=v2.4.0-naturalize-balanced-vocoder"; do
            FIELD="${CHECK%%=*}"
            WANT="${CHECK#*=}"
            GOT="$(jq -r ".output.${FIELD} // \"none\"" "$RESULT")"
            if [ "$GOT" != "$WANT" ]; then
              echo "Wrong ${FIELD}: expected ${WANT}, got ${GOT}" >&2
              exit 1
            fi
          done

          {
            echo "### ${ACTION}"
            echo ""
            echo "- worker: $(jq -r '.output.stemforge_version // "?"' "$RESULT") / $(jq -r '.output.build // "?"' "$RESULT")"
            echo "- naturalize accepted: $(jq -r '(.output.naturalize.safety.accepted // .output.safety.accepted) // "n/a"' "$RESULT")"
            echo "- resolved mode: $(jq -r '(.output.naturalize.resolved_mode // .output.resolved_mode) // "n/a"' "$RESULT")"
            echo "- intensity: $(jq -r '(.output.naturalize.intensity // .output.intensity) // "n/a"' "$RESULT")"
            echo "- pumping index: $(jq -r '(.output.naturalize.safety.envelope.pumping_index // .output.safety.envelope.pumping_index) // "n/a"' "$RESULT")"
            echo "- MIDI files: $(jq -r '.output.input_summary.midi_file_count // "n/a"' "$RESULT")"
            echo "- tempo overrides: $(jq -c '.output.tempo_linked_mastering_overrides // {}' "$RESULT")"
            if [ "$(jq -r '(.output.candidates // []) | length' "$RESULT")" -gt 0 ]; then
              echo ""
              echo "| profile | LUFS | peak dBFS | crest dB | release ms | safe |"
              echo "| --- | --- | --- | --- | --- | --- |"
              jq -r '(.output.candidates // [])[] | "| \(.profile) | \(.metrics.integrated_lufs) | \(.metrics.sample_peak_dbfs) | \(.metrics.crest_factor_db) | \(.chain.release_ms) | \(.safety.accepted) |"' "$RESULT"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect the delivered assets
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${{ steps.release.outputs.id }}/assets" --jq 'length')"
          if [ "$COUNT" -eq 0 ]; then
            echo "The worker uploaded no assets. github_release_export may not be wired for this action." >&2
            jq -r '.output | keys' delivery/runpod_result.json >&2 || true
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/${{ steps.release.outputs.id }}/assets" \
            --jq '.[] | "\(.id) \(.name)"' \
          | while read -r ASSET_ID ASSET_NAME; do
              gh api -H "Accept: application/octet-stream" \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" > "delivery/${ASSET_NAME}"
              echo "collected ${ASSET_NAME} ($(stat -c%s "delivery/${ASSET_NAME}") bytes)"
            done
          ( cd delivery && sha256sum ./* > SHA256SUMS.txt ) || true

      - name: Upload the render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-pass-${{ steps.meta.outputs.name }}-${{ github.run_id }}
          path: delivery/
          retention-days: 90

      - name: Remove the temporary release
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/releases/${{ steps.release.outputs.id }}" || true
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/${{ steps.release.outputs.tag }}" || true
