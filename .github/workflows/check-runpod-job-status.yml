name: Check RunPod Job Status

on:
  push:
    branches: [main]
    paths:
      - "runpod_status_requests/*.json"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_ENDPOINT_ID: dyup1dztjr4u15
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Fetch requested RunPod status
        shell: bash
        run: |
          set -euo pipefail
          REQUEST="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^runpod_status_requests/.+\.json$' | head -n1)"
          test -n "$REQUEST"
          JOB_ID="$(jq -r '.job_id' "$REQUEST")"
          NAME="$(basename "$REQUEST" .json)"
          mkdir -p runpod_status_results
          curl --fail --silent --show-error --max-time 120 \
            "https://api.runpod.ai/v2/${RUNPOD_ENDPOINT_ID}/status/${JOB_ID}" \
            -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
            > "runpod_status_results/${NAME}.json"

      - name: Commit status result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "stemforge-status"
          git config user.email "stemforge-status@users.noreply.github.com"
          git add runpod_status_results/
          git commit -m "Record RunPod job status [skip ci]"
          git push || {
            git pull --rebase --autostash origin main
            git push
          }
