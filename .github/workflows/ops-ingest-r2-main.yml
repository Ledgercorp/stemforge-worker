name: Temporary R2 Ingest Bridge

on:
  push:
    branches: [main]
    paths:
      - "ops_ingest_requests_main/*.json"

permissions:
  contents: write

concurrency:
  group: stemforge-temporary-r2-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUNPOD_ENDPOINT_ID: dyup1dztjr4u15
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          CHANGED="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
          mapfile -t FILES < <(printf '%s\n' "$CHANGED" | grep -E '^ops_ingest_requests_main/.+\.json$' || true)
          test "${#FILES[@]}" -eq 1
          REQUEST="${FILES[0]}"
          jq -e '.source_url and .name and .record_as' "$REQUEST" >/dev/null
          echo "request=$REQUEST" >> "$GITHUB_OUTPUT"

      - name: Ingest source into R2
        shell: bash
        run: |
          set -euo pipefail
          REQUEST='${{ steps.request.outputs.request }}'
          SOURCE_URL="$(jq -r '.source_url' "$REQUEST")"
          NAME="$(jq -r '.name' "$REQUEST")"
          ARTIST="$(jq -r '.artist // "sounddecay"' "$REQUEST")"
          RECORD_AS="$(jq -r '.record_as' "$REQUEST")"
          EXPAND="$(jq -r '.expand // false' "$REQUEST")"
          mkdir -p ingested
          ARGS=(--from-url "$SOURCE_URL" --artist "$ARTIST" --name "$NAME" --json --quiet)
          if [ "$EXPAND" = "true" ]; then
            ARGS+=(--expand)
          fi
          python tools/ingest_audio.py "${ARGS[@]}" > "ingested/${RECORD_AS}.json"
          jq -e '.ingested | length > 0' "ingested/${RECORD_AS}.json" >/dev/null

      - name: Record stable storage keys
        shell: bash
        run: |
          set -euo pipefail
          REQUEST='${{ steps.request.outputs.request }}'
          RECORD_AS="$(jq -r '.record_as' "$REQUEST")"
          git config user.name "stemforge-ingest"
          git config user.email "stemforge-ingest@users.noreply.github.com"
          git add "ingested/${RECORD_AS}.json"
          git commit -m "Record ingested storage keys for ${RECORD_AS} [skip ci]"
          git push || {
            for attempt in 1 2 3; do
              sleep $((attempt * 5))
              git pull --rebase --autostash origin main && git push && break
            done
          }

      - name: Upload ingest record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporary-r2-ingest-${{ github.run_id }}
          path: ingested/
          if-no-files-found: ignore
          retention-days: 7
