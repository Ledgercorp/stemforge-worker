name: Publish StemForge v2.0.2

on:
  push:
    branches:
      - main
    paths:
      - "release/v2.0.2.txt"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create v2.0.2 release from current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.0.2 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "v2.0.2 already exists."
            exit 0
          fi
          gh release create v2.0.2 \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "StemForge v2.0.2 Persistent Outputs" \
            --notes "Persists generated audio and reports to the RunPod network volume when S3-compatible storage is not configured."
