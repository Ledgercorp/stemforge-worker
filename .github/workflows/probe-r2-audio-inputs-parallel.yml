name: Probe R2 Audio Inputs Parallel

on:
  push:
    branches: [main]
    paths:
      - "storage_audio_probe_parallel_requests/*.json"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RUNPOD_ENDPOINT_ID: dyup1dztjr4u15
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t FILES < <(
            git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" \
              | grep -E '^storage_audio_probe_parallel_requests/.+\.json$' || true
          )
          test "${#FILES[@]}" -eq 1
          echo "request=${FILES[0]}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${FILES[0]}" .json)" >> "$GITHUB_OUTPUT"

      - name: Probe all objects concurrently
        env:
          REQUEST: ${{ steps.request.outputs.request }}
          RESULT_NAME: ${{ steps.request.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p storage_audio_probe_results
          python3 - <<'PY'
          import concurrent.futures
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import time
          import urllib.error
          import urllib.request

          endpoint = os.environ['RUNPOD_ENDPOINT_ID']
          key = os.environ['RUNPOD_API_KEY']
          request_path = pathlib.Path(os.environ['REQUEST'])
          result_name = os.environ['RESULT_NAME']
          objects = json.loads(request_path.read_text())['objects']
          api = f'https://api.runpod.ai/v2/{endpoint}'

          def urlopen(req, timeout):
              last = None
              for attempt in range(20):
                  try:
                      return urllib.request.urlopen(req, timeout=timeout)
                  except (urllib.error.URLError, TimeoutError, ConnectionError) as exc:
                      last = exc
                      if attempt == 19:
                          raise
                      time.sleep(min(2 + attempt, 12))
              raise last

          def submit(obj):
              payload = {
                  'input': {'action': 'create_download', 'storage_key': obj['storage_key'], 'ttl_seconds': 3600},
                  'policy': {'ttl': 900000, 'executionTimeout': 600000},
              }
              req = urllib.request.Request(
                  f'{api}/run', data=json.dumps(payload).encode(), method='POST',
                  headers={'Authorization': f'Bearer {key}', 'Content-Type': 'application/json'},
              )
              with urlopen(req, 120) as response:
                  submitted = json.loads(response.read())
              if not submitted.get('id'):
                  raise RuntimeError(f"No RunPod job id for {obj['name']}: {submitted}")
              return obj, submitted['id']

          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              submitted = list(pool.map(submit, objects))

          def resolve(pair):
              obj, job_id = pair
              status_req = urllib.request.Request(
                  f'{api}/status/{job_id}', headers={'Authorization': f'Bearer {key}'})
              status = None
              for _ in range(400):
                  time.sleep(3)
                  try:
                      with urlopen(status_req, 60) as response:
                          status = json.loads(response.read())
                  except Exception:
                      continue
                  if status.get('status') in {'COMPLETED','FAILED','TIMED_OUT','CANCELLED'}:
                      break
              if not status or status.get('status') != 'COMPLETED' or (status.get('output') or {}).get('status') != 'completed':
                  return {**obj, 'job_id': job_id, 'download_error': status or 'no terminal status'}
              return {**obj, 'job_id': job_id, 'download_url': status['output']['download_url']}

          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              resolved = list(pool.map(resolve, submitted))

          probe_dir = pathlib.Path('/tmp/r2-parallel-probe')
          probe_dir.mkdir(parents=True, exist_ok=True)

          def inspect(obj):
              if not obj.get('download_url'):
                  return obj
              destination = probe_dir / obj['name']
              req = urllib.request.Request(obj['download_url'])
              with urlopen(req, 1800) as response, destination.open('wb') as out:
                  while True:
                      chunk = response.read(1024 * 1024)
                      if not chunk:
                          break
                      out.write(chunk)
              raw = destination.read_bytes()
              probe = subprocess.run(
                  ['ffprobe','-v','error','-show_entries','format=duration:stream=codec_name,sample_rate,channels,sample_fmt','-of','json',str(destination)],
                  capture_output=True, text=True,
              )
              return {
                  'name': obj['name'],
                  'storage_key': obj['storage_key'],
                  'job_id': obj['job_id'],
                  'size_bytes': len(raw),
                  'sha256': hashlib.sha256(raw).hexdigest(),
                  'magic_hex': raw[:16].hex(),
                  'ffprobe_readable': probe.returncode == 0,
                  'ffprobe': json.loads(probe.stdout) if probe.returncode == 0 else None,
                  'error': probe.stderr.strip(),
              }

          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              reports = list(pool.map(inspect, resolved))

          out = pathlib.Path('storage_audio_probe_results') / f'{result_name}.json'
          out.write_text(json.dumps({'objects': reports}, indent=2) + '\n')
          PY

      - name: Record probe result
        env:
          RESULT_NAME: ${{ steps.request.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "stemforge-probe"
          git config user.email "stemforge-probe@users.noreply.github.com"
          git add "storage_audio_probe_results/${RESULT_NAME}.json"
          git commit -m "Record parallel R2 audio probe for ${RESULT_NAME} [skip ci]"
          git push || {
            for attempt in 1 2 3; do
              sleep $((attempt * 5))
              git pull --rebase --autostash origin main && git push && break
            done
          }
