name: Deploy StemForge

# Guarded production deployment to the existing RunPod Serverless endpoint.
#
# Nothing here is hardcoded to a registry, template id or image tag: the image
# repository is supplied by the operator, and the template id is discovered
# from the endpoint at run time. Required secrets:
#
#   RUNPOD_API_KEY_ADMIN  RunPod API key with template read/write scope.
#                         The existing RUNPOD_API_KEY is run-scoped and returns
#                         401 from rest.runpod.io/v1, so it cannot be used here.
#   REGISTRY_USERNAME     Container registry user.
#   REGISTRY_PASSWORD     Container registry token/password.
#
# Deployment always ends with a live system_info assertion. If the live worker
# does not report the exact expected version and build, the run fails.

on:
  workflow_dispatch:
    inputs:
      image_repository:
        description: "Image repository without tag, e.g. registry.example.com/ns/stemforge-worker"
        required: true
        type: string
      version:
        description: "Immutable version tag to publish, e.g. v2.4.0"
        required: true
        type: string
      expected_version:
        description: "stemforge_version the live worker must report"
        required: true
        default: "2.4.0"
        type: string
      expected_build:
        description: "build the live worker must report"
        required: true
        default: "v2.4.0-naturalize-balanced-vocoder"
        type: string
      rollback_image:
        description: "Full image reference to roll back to. When set, no image is built and the template is pointed at this reference."
        required: false
        type: string
      pin_by_digest:
        description: "Point the template at repository@sha256:... instead of the mutable tag"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: stemforge-deploy
  cancel-in-progress: false

env:
  RUNPOD_ENDPOINT_ID: dyup1dztjr4u15

jobs:
  validate:
    name: Compile and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      STEMFORGE_WORKSPACE: ${{ runner.temp }}/stemforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install system audio tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-ci.txt
      - name: Compile worker
        run: python -m compileall -q app handler.py
      - name: Run regression tests
        run: python -m pytest -q
      - name: Validate relay request files
        run: python tools/validate_jobs.py
      - name: Assert the source declares the expected identity
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version || '2.4.0' }}
          EXPECTED_BUILD: ${{ inputs.expected_build || 'v2.4.0-naturalize-balanced-vocoder' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from app.system_v2 import VERSION, BUILD
          expected_version = os.environ["EXPECTED_VERSION"]
          expected_build = os.environ["EXPECTED_BUILD"]
          assert VERSION == expected_version, f"source VERSION {VERSION} != {expected_version}"
          assert BUILD == expected_build, f"source BUILD {BUILD} != {expected_build}"
          print(f"source identity OK: {VERSION} / {BUILD}")
          PY

  build:
    name: Build and push image
    needs: validate
    if: ${{ !inputs.rollback_image }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      image_reference: ${{ steps.reference.outputs.image_reference }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image coordinates
        id: coords
        env:
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          REPO="${IMAGE_REPOSITORY:-}"
          VERSION="${VERSION_INPUT:-}"
          if [ -z "$VERSION" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          fi
          if [ -z "$REPO" ]; then
            echo "image_repository is required. There is no registry configured in this repository, so it cannot be inferred." >&2
            exit 1
          fi
          test -n "$VERSION"
          echo "repository=$REPO" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.coords.outputs.repository }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push immutable tags
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ steps.coords.outputs.repository }}:${{ steps.coords.outputs.version }}
            ${{ steps.coords.outputs.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record the image reference
        id: reference
        env:
          REPOSITORY: ${{ steps.coords.outputs.repository }}
          VERSION: ${{ steps.coords.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
          PIN_BY_DIGEST: ${{ inputs.pin_by_digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          if [ "${PIN_BY_DIGEST}" = "false" ]; then
            REFERENCE="${REPOSITORY}:${VERSION}"
          else
            REFERENCE="${REPOSITORY}@${DIGEST}"
          fi
          echo "image_reference=$REFERENCE" >> "$GITHUB_OUTPUT"
          {
            echo "### Image published"
            echo ""
            echo "- reference: \`${REFERENCE}\`"
            echo "- version tag: \`${REPOSITORY}:${VERSION}\`"
            echo "- commit tag: \`${REPOSITORY}:sha-${GITHUB_SHA}\`"
            echo "- digest: \`${DIGEST}\`"
            echo "- commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Update RunPod template
    needs: [validate, build]
    if: ${{ always() && needs.validate.result == 'success' && (needs.build.result == 'success' || inputs.rollback_image) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUNPOD_API_KEY_ADMIN: ${{ secrets.RUNPOD_API_KEY_ADMIN }}
      IMAGE_REFERENCE: ${{ inputs.rollback_image || needs.build.outputs.image_reference }}
      EXPECTED_VERSION: ${{ inputs.expected_version || '2.4.0' }}
      EXPECTED_BUILD: ${{ inputs.expected_build || 'v2.4.0-naturalize-balanced-vocoder' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment secret
        run: |
          set -euo pipefail
          if [ -z "${RUNPOD_API_KEY_ADMIN}" ]; then
            echo "RUNPOD_API_KEY_ADMIN is missing. It must have template read/write scope." >&2
            exit 1
          fi
          test -n "${IMAGE_REFERENCE}"

      - name: Capture rollback snapshot
        id: snapshot
        run: |
          set -euo pipefail
          mkdir -p deployment_records
          # Endpoint, with its bound template, is the authoritative current state.
          curl --fail --silent --show-error \
            "https://rest.runpod.io/v1/endpoints?includeTemplate=true" \
            -H "Authorization: Bearer ${RUNPOD_API_KEY_ADMIN}" > /tmp/endpoints.json

          jq --arg id "${RUNPOD_ENDPOINT_ID}" \
            '[.[] | select(.id == $id)] | first' /tmp/endpoints.json > /tmp/endpoint.json
          test "$(jq -r '.id // empty' /tmp/endpoint.json)" = "${RUNPOD_ENDPOINT_ID}"

          TEMPLATE_ID="$(jq -r '.templateId // .template.id // empty' /tmp/endpoint.json)"
          test -n "$TEMPLATE_ID"

          # Non-secret configuration only: env var VALUES are never captured.
          jq '{
                endpoint_id: .id,
                template_id: (.templateId // .template.id),
                previous_image: .template.imageName,
                workers_min: .workersMin,
                workers_max: .workersMax,
                idle_timeout: .idleTimeout,
                execution_timeout_ms: .executionTimeoutMs,
                scaler_type: .scalerType,
                scaler_value: .scalerValue,
                gpu_type_ids: .gpuTypeIds,
                gpu_count: .gpuCount,
                flashboot: .flashboot,
                container_disk_in_gb: .template.containerDiskInGb,
                volume_in_gb: .template.volumeInGb,
                volume_mount_path: .template.volumeMountPath,
                docker_entrypoint: .template.dockerEntrypoint,
                docker_start_cmd: .template.dockerStartCmd,
                ports: .template.ports,
                env_var_names: ((.template.env // {}) | keys)
              }' /tmp/endpoint.json > deployment_records/rollback-snapshot.json

          echo "template_id=$TEMPLATE_ID" >> "$GITHUB_OUTPUT"
          echo "previous_image=$(jq -r '.previous_image // "unknown"' deployment_records/rollback-snapshot.json)" >> "$GITHUB_OUTPUT"
          jq . deployment_records/rollback-snapshot.json

      - name: Point the existing template at the new image
        run: |
          set -euo pipefail
          # PATCH /v1/templates/{id} triggers a rolling release on the bound
          # endpoint. Only imageName changes; every other setting and all
          # environment variables are left exactly as they are.
          curl --fail --silent --show-error \
            --request PATCH \
            "https://rest.runpod.io/v1/templates/${{ steps.snapshot.outputs.template_id }}" \
            -H "Authorization: Bearer ${RUNPOD_API_KEY_ADMIN}" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --arg image "${IMAGE_REFERENCE}" '{imageName: $image}')" \
            -o /tmp/template-updated.json
          jq '{id, name, imageName}' /tmp/template-updated.json

      - name: Verify live system_info
        id: verify
        run: |
          set -euo pipefail
          mkdir -p deployment_records

          # A rolling release takes time; poll until the live identity matches
          # or the budget runs out. Only system_info is submitted - no paid
          # audio work runs before verification passes.
          DEADLINE=$(( $(date +%s) + 1500 ))
          ATTEMPT=0
          while :; do
            ATTEMPT=$((ATTEMPT + 1))
            SUBMIT="$(curl --fail --silent --show-error \
              --request POST "https://api.runpod.ai/v2/${RUNPOD_ENDPOINT_ID}/run" \
              -H "Authorization: Bearer ${RUNPOD_API_KEY_ADMIN}" \
              -H "Content-Type: application/json" \
              --data '{"input":{"action":"system_info"},"policy":{"ttl":600000,"executionTimeout":300000}}')"
            JOB_ID="$(printf '%s' "$SUBMIT" | jq -r '.id // empty')"
            test -n "$JOB_ID"

            for _ in $(seq 1 60); do
              sleep 5
              curl --fail --silent --show-error \
                "https://api.runpod.ai/v2/${RUNPOD_ENDPOINT_ID}/status/${JOB_ID}" \
                -H "Authorization: Bearer ${RUNPOD_API_KEY_ADMIN}" > /tmp/status.json
              STATE="$(jq -r '.status // empty' /tmp/status.json)"
              case "$STATE" in COMPLETED|FAILED|TIMED_OUT|CANCELLED) break ;; esac
            done

            LIVE_VERSION="$(jq -r '.output.stemforge_version // empty' /tmp/status.json)"
            LIVE_BUILD="$(jq -r '.output.build // empty' /tmp/status.json)"
            echo "attempt ${ATTEMPT}: state=${STATE} version=${LIVE_VERSION:-none} build=${LIVE_BUILD:-none}"

            if [ "$LIVE_VERSION" = "${EXPECTED_VERSION}" ] && [ "$LIVE_BUILD" = "${EXPECTED_BUILD}" ]; then
              break
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "Live worker never reported ${EXPECTED_VERSION} / ${EXPECTED_BUILD}." >&2
              jq '.output | {stemforge_version, build}' /tmp/status.json >&2 || true
              exit 1
            fi
            sleep 30
          done

          cp /tmp/status.json deployment_records/live-system-info.json
          echo "verification_job_id=${JOB_ID}" >> "$GITHUB_OUTPUT"

          # Exact contract assertions. Any mismatch fails the deployment.
          jq -e '
            .status == "COMPLETED"
            and .output.status == "completed"
            and .output.action == "system_info"
            and .output.naturalize.default_intensity == 1.0
            and .output.naturalize.preset == "Naturalize Balanced"
            and .output.naturalize.maximum_full_passes == 2
            and .output.naturalize.second_pass_maximum_intensity_scale == 0.70
            and .output.naturalize.denoise_constraints.position == "post_cocktail_only"
            and .output.quality_gates.automatic_intensity_reduction == true
            and .output.quality_gates.vocoder_fallback_to_dsp == true
            and .output.reliability_guards.lazy_optional_vocoder_imports == true
          ' /tmp/status.json > /dev/null

          {
            echo "### Live verification"
            echo ""
            echo "- image: \`${IMAGE_REFERENCE}\`"
            echo "- template: \`${{ steps.snapshot.outputs.template_id }}\`"
            echo "- endpoint: \`${RUNPOD_ENDPOINT_ID}\`"
            echo "- verification job: \`${JOB_ID}\`"
            echo "- live version/build: \`${LIVE_VERSION}\` / \`${LIVE_BUILD}\`"
            echo "- previous image (rollback): \`${{ steps.snapshot.outputs.previous_image }}\`"
            echo ""
            echo "Vocoder backend availability:"
            jq -r '.output.packages | to_entries[] | select(.key | test("vocos|bigvgan|discoder")) | "- \(.key): \(.value)"' /tmp/status.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stemforge-deployment-${{ github.run_id }}
          path: deployment_records/
          retention-days: 90
