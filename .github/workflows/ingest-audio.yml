name: Ingest Audio

# Turns a fragile source URL into a stable storage key.
#
# Renders currently take input from Google Drive links, which expire and can
# serve an HTML quota page instead of audio - a failure that surfaces much
# later as a confusing decode error. Run this once per file and every later
# render can reference the resulting `storage_key` instead.
#
# The runner has open internet and the RunPod key, so this works from a phone:
# dispatch it manually or commit exactly one validated request under
# ingest_requests/.

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Sources, one per line: URLs, or repository paths"
        required: true
        type: string
      expand_zips:
        description: "Expand a zip of audio into one object per stem (MIDI zips stay whole)"
        required: false
        default: false
        type: boolean
      names:
        description: "Optional filenames, one per line, matched in order"
        required: false
        type: string
      artist:
        description: "Artist prefix for the storage keys"
        required: false
        default: "sounddecay"
        type: string
      record_as:
        description: "Optional name to commit the keys under in ingested/"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "ingest_requests/**/*.json"

permissions:
  contents: write

concurrency:
  group: stemforge-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUNPOD_ENDPOINT_ID: dyup1dztjr4u15
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve ingest configuration
        id: config
        shell: bash
        env:
          DISPATCH_URLS: ${{ inputs.urls }}
          DISPATCH_NAMES: ${{ inputs.names }}
          DISPATCH_ARTIST: ${{ inputs.artist }}
          DISPATCH_EXPAND: ${{ inputs.expand_zips }}
          DISPATCH_RECORD_AS: ${{ inputs.record_as }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            URLS="$DISPATCH_URLS"
            NAMES="${DISPATCH_NAMES:-}"
            ARTIST="${DISPATCH_ARTIST:-sounddecay}"
            EXPAND="${DISPATCH_EXPAND:-false}"
            RECORD_AS="${DISPATCH_RECORD_AS:-}"
          else
            CHANGED="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
            mapfile -t REQUESTS < <(printf '%s\n' "$CHANGED" | grep -E '^ingest_requests/.+\.json$' || true)
            test "${#REQUESTS[@]}" -eq 1
            REQUEST="${REQUESTS[0]}"
            jq -e '(.urls or .source_url) and (.record_as | type == "string" and length > 0)' "$REQUEST" >/dev/null
            URLS="$(jq -r 'if .urls then (if (.urls|type)=="array" then .urls[] else .urls end) else .source_url end' "$REQUEST")"
            NAMES="$(jq -r 'if .names then (if (.names|type)=="array" then .names[] else .names end) elif .name then .name else empty end' "$REQUEST")"
            ARTIST="$(jq -r '.artist // "sounddecay"' "$REQUEST")"
            EXPAND="$(jq -r '.expand_zips // .expand // false' "$REQUEST")"
            RECORD_AS="$(jq -r '.record_as' "$REQUEST")"
          fi

          {
            echo 'urls<<STEMFORGE_EOF'
            printf '%s\n' "$URLS"
            echo 'STEMFORGE_EOF'
            echo 'names<<STEMFORGE_EOF'
            printf '%s\n' "$NAMES"
            echo 'STEMFORGE_EOF'
            echo "artist=$ARTIST"
            echo "expand=$EXPAND"
            echo "record_as=$RECORD_AS"
          } >> "$GITHUB_OUTPUT"

      - name: Ingest each source
        id: ingest
        shell: bash
        env:
          URLS: ${{ steps.config.outputs.urls }}
          NAMES: ${{ steps.config.outputs.names }}
          ARTIST: ${{ steps.config.outputs.artist }}
          EXPAND: ${{ steps.config.outputs.expand }}
        run: |
          set -euo pipefail
          test -n "$RUNPOD_API_KEY"
          mkdir -p ingested

          mapfile -t SOURCES < <(printf '%s\n' "$URLS" | tr -d '\r' | sed '/^[[:space:]]*$/d')
          mapfile -t LABELS  < <(printf '%s\n' "${NAMES:-}" | tr -d '\r' | sed '/^[[:space:]]*$/d')
          test "${#SOURCES[@]}" -gt 0

          echo '{"ingested":[]}' > ingested/records.json
          for INDEX in "${!SOURCES[@]}"; do
            SOURCE="${SOURCES[$INDEX]}"
            case "$SOURCE" in
              http://*|https://*) ARGS=(--from-url "$SOURCE") ;;
              *) test -f "$SOURCE"; ARGS=("$SOURCE") ;;
            esac
            ARGS+=(--artist "$ARTIST" --json --quiet)
            if [ "$EXPAND" = "true" ]; then
              ARGS+=(--expand)
            fi
            if [ "$INDEX" -lt "${#LABELS[@]}" ]; then
              ARGS+=(--name "${LABELS[$INDEX]}")
            fi
            python tools/ingest_audio.py "${ARGS[@]}" > /tmp/one.json
            jq -s '{ingested: (.[0].ingested + .[1].ingested)}' \
              ingested/records.json /tmp/one.json > /tmp/merged.json
            mv /tmp/merged.json ingested/records.json
          done

          {
            echo "### Ingested"
            echo ""
            echo "| storage key | filename | bytes |"
            echo "| --- | --- | --- |"
            jq -r '.ingested[] | "| `\(.storage_key)` | \(.filename) | \(.size_bytes) |"' \
              ingested/records.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record the keys
        if: ${{ steps.config.outputs.record_as != '' }}
        shell: bash
        env:
          RECORD_AS: ${{ steps.config.outputs.record_as }}
        run: |
          set -euo pipefail
          SAFE="$(printf '%s' "$RECORD_AS" | tr -c 'A-Za-z0-9._-' '-')"
          mv ingested/records.json "ingested/${SAFE}.json"
          git config user.name "stemforge-ingest"
          git config user.email "stemforge-ingest@users.noreply.github.com"
          git add "ingested/${SAFE}.json"
          git commit -m "Record ingested storage keys for ${SAFE} [skip ci]"
          BRANCH="$GITHUB_REF_NAME"
          git push || {
            for attempt in 1 2 3; do
              sleep $((attempt * 5))
              git pull --rebase --autostash origin "$BRANCH" && git push && break
            done
          }

      - name: Upload the key record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingested-${{ github.run_id }}
          path: ingested/
          retention-days: 90
