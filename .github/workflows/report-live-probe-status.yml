name: Report Live Probe Status

on:
  push:
    branches: [main]
    paths:
      - "system_probe_status_requests/**/*.txt"

permissions:
  contents: write
  actions: read

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Report recent workflow runs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p system_probe_status_results
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 25 \
            --json databaseId,status,conclusion,headSha,event,displayTitle,createdAt,updatedAt,url \
            > system_probe_status_results/recent.json
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
            --jq '[.workflows[] | {id,name,path,state}]' \
            > system_probe_status_results/workflows.json

          publish_file() {
            local path="$1"
            local encoded existing_sha
            encoded="$(base64 -w0 "$path")"
            existing_sha="$(gh api \
              "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" \
              --jq '.sha' 2>/dev/null || true)"
            local args=(
              --method PUT
              "repos/${GITHUB_REPOSITORY}/contents/${path}"
              -f message="Record recent probe workflow status [skip ci]"
              -f content="$encoded"
              -f branch="main"
            )
            if [ -n "$existing_sha" ]; then
              args+=( -f sha="$existing_sha" )
            fi
            gh api "${args[@]}" >/dev/null
          }

          publish_file system_probe_status_results/recent.json
          publish_file system_probe_status_results/workflows.json
