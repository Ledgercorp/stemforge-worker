name: Install StemForge v2 source

on:
  push:
    branches: [main]
    paths:
      - "source_bundle/stemforge_v2_source.tar.gz.b64"
      - ".github/workflows/unpack-v2.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Expand verified source bundle
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode source_bundle/stemforge_v2_source.tar.gz.b64 > /tmp/stemforge-v2.tar.gz
          tar -xzf /tmp/stemforge-v2.tar.gz -C .
          python -m compileall -q app tests handler.py
          rm -rf source_bundle
          rm -f .github/workflows/unpack-v2.yml
      - name: Commit expanded v2 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "stemforge-v2-installer"
          git config user.email "stemforge-v2-installer@users.noreply.github.com"
          git add -A
          git commit -m "Install StemForge v2 production engine"
          git push
