name: StemForge CI

on:
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "tools/**"
      - "handler.py"
      - "requirements*.txt"
      - "Dockerfile"
      - ".github/workflows/**"
      - "cancel_requests/**/*.json"
      - "direct_balanced_requests/**/*.json"
      - "direct_master_requests/**/*.json"
      - "download_requests/**/*.json"
      - "export_requests/**/*.json"
      - "full_pass_direct_requests/**/*.json"
      - "full_pass_jobs/**/*.json"
      - "full_pass_retry_jobs/**/*.json"
      - "jobs/**/*.json"
      - "maintenance/**/*.json"
      - "status_probe_jobs/**/*.json"
      - "stem_remix_jobs/**/*.json"
      - "stem_remix_retry_jobs/**/*.json"
      - "system_probe_requests/**/*.json"
      - "v2_balanced_fetch/**/*.json"
      - "v2_bridge_requests/**/*.json"
      - "v2_export_jobs/**/*.json"
      - "v2_jobs/**/*.json"
      - "v2_output_requests/**/*.json"
      - "v201_quick_checks/**/*.json"
      - "v201_quick_jobs/**/*.json"
  push:
    branches:
      - main
      - "fix/**"
    paths:
      - "app/**"
      - "tests/**"
      - "tools/**"
      - "handler.py"
      - "requirements*.txt"
      - "Dockerfile"
      - ".github/workflows/**"
      - "cancel_requests/**/*.json"
      - "direct_balanced_requests/**/*.json"
      - "direct_master_requests/**/*.json"
      - "download_requests/**/*.json"
      - "export_requests/**/*.json"
      - "full_pass_direct_requests/**/*.json"
      - "full_pass_jobs/**/*.json"
      - "full_pass_retry_jobs/**/*.json"
      - "jobs/**/*.json"
      - "maintenance/**/*.json"
      - "status_probe_jobs/**/*.json"
      - "stem_remix_jobs/**/*.json"
      - "stem_remix_retry_jobs/**/*.json"
      - "system_probe_requests/**/*.json"
      - "v2_balanced_fetch/**/*.json"
      - "v2_bridge_requests/**/*.json"
      - "v2_export_jobs/**/*.json"
      - "v2_jobs/**/*.json"
      - "v2_output_requests/**/*.json"
      - "v201_quick_checks/**/*.json"
      - "v201_quick_jobs/**/*.json"

permissions:
  contents: read

jobs:
  job-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate relay request files
        run: python tools/validate_jobs.py
      - name: Lint workflow definitions
        # A workflow can be valid YAML and still be rejected by GitHub, which
        # shows up as a run with zero jobs and no logs. actionlint catches
        # those before they reach main.
        #
        # shellcheck and pyflakes integration is off: it reports pre-existing
        # style warnings across the legacy probe and release workflows, which
        # would block unrelated pull requests. This checks workflow schema and
        # expression contexts, which is the failure mode that reaches main
        # silently.
        run: |
          python -m pip install --quiet actionlint-py==1.7.12.24
          actionlint -shellcheck= -pyflakes=

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install system audio tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-ci.txt
      - name: Compile worker
        env:
          STEMFORGE_WORKSPACE: ${{ runner.temp }}/stemforge
        run: python -m compileall -q app handler.py
      - name: Run regression tests
        env:
          STEMFORGE_WORKSPACE: ${{ runner.temp }}/stemforge
        run: python -m pytest -q
