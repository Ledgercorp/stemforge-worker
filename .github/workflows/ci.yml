name: StemForge CI

on:
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "handler.py"
      - "requirements*.txt"
      - "Dockerfile"
      - ".github/workflows/**"
  push:
    branches:
      - main
      - "fix/**"
    paths:
      - "app/**"
      - "tests/**"
      - "handler.py"
      - "requirements*.txt"
      - "Dockerfile"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install system audio tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-ci.txt
      - name: Compile worker
        run: python -m compileall -q app handler.py
      - name: Run regression tests
        run: python -m pytest -q
