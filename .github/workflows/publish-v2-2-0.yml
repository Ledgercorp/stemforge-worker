name: Publish StemForge v2.2.0

on:
  push:
    branches: [main]
    paths:
      - "release/v2.2.0.txt"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish v2.2.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete v2.2.0 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          fi
          gh release create v2.2.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "StemForge v2.2.0 Stem Remix" \
            --notes "Adds a reference-guided stem remix engine using all supplied stems and MIDI timing, with balanced, heavy, and premaster WAV delivery."
