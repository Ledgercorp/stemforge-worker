name: Publish StemForge v2.0.3

on:
  push:
    branches:
      - main
    paths:
      - "release/v2.0.3.txt"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create v2.0.3 release from current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.0.3 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "v2.0.3 already exists."
            exit 0
          fi
          gh release create v2.0.3 \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "StemForge v2.0.3 Same-Job Export" \
            --notes "Uploads rendered masters to a temporary private GitHub release before the RunPod worker exits, allowing verified retrieval without S3 or a network volume."
