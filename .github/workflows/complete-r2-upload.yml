name: Complete Existing R2 Upload

on:
  push:
    branches: [main]
    paths:
      - "complete_upload_requests/*.json"

permissions:
  contents: write

concurrency:
  group: stemforge-complete-r2-upload
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUNPOD_ENDPOINT_ID: dyup1dztjr4u15
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          CHANGED="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
          mapfile -t FILES < <(printf '%s\n' "$CHANGED" | grep -E '^complete_upload_requests/.+\.json$' || true)
          test "${#FILES[@]}" -eq 1
          REQUEST="${FILES[0]}"
          jq -e '.job_id and .source_url and .record_as' "$REQUEST" >/dev/null
          echo "request=$REQUEST" >> "$GITHUB_OUTPUT"

      - name: Upload with completed authorization
        shell: bash
        run: |
          set -euo pipefail
          REQUEST='${{ steps.request.outputs.request }}'
          JOB_ID="$(jq -r '.job_id' "$REQUEST")"
          SOURCE_URL="$(jq -r '.source_url' "$REQUEST")"
          RECORD_AS="$(jq -r '.record_as' "$REQUEST")"
          EXPECTED_SIZE="$(jq -r '.expected_size_bytes // 0' "$REQUEST")"
          mkdir -p ingested

          curl --fail --silent --show-error --max-time 120 \
            "https://api.runpod.ai/v2/${RUNPOD_ENDPOINT_ID}/status/${JOB_ID}" \
            -H "Authorization: Bearer ${RUNPOD_API_KEY}" > /tmp/status.json
          jq -e '.status == "COMPLETED" and .output.status == "completed" and .output.action == "create_upload"' /tmp/status.json >/dev/null
          UPLOAD_URL="$(jq -r '.output.upload_url' /tmp/status.json)"
          STORAGE_KEY="$(jq -r '.output.storage_key' /tmp/status.json)"
          CONTENT_TYPE="$(jq -r '.output.headers["Content-Type"] // "application/octet-stream"' /tmp/status.json)"
          FILENAME="$(basename "$STORAGE_KEY")"

          curl --fail --location --silent --show-error --max-time 1800 \
            -A "stemforge-ingest" "$SOURCE_URL" -o /tmp/source.bin
          if head -c 32 /tmp/source.bin | tr '[:upper:]' '[:lower:]' | grep -q '<!doctype\|<html'; then
            echo "source returned HTML" >&2
            exit 1
          fi
          ACTUAL_SIZE="$(stat -c '%s' /tmp/source.bin)"
          if [ "$EXPECTED_SIZE" -gt 0 ]; then
            test "$ACTUAL_SIZE" -eq "$EXPECTED_SIZE"
          fi

          curl --fail --silent --show-error --max-time 1800 -X PUT \
            -H "Content-Type: ${CONTENT_TYPE}" \
            --data-binary @/tmp/source.bin \
            "$UPLOAD_URL" >/dev/null

          jq -n \
            --arg storage_key "$STORAGE_KEY" \
            --arg filename "$FILENAME" \
            --argjson size_bytes "$ACTUAL_SIZE" \
            '{ingested:[{storage_key:$storage_key,filename:$filename,size_bytes:$size_bytes}]}' \
            > "ingested/${RECORD_AS}.json"

      - name: Record stable storage key
        shell: bash
        run: |
          set -euo pipefail
          REQUEST='${{ steps.request.outputs.request }}'
          RECORD_AS="$(jq -r '.record_as' "$REQUEST")"
          git config user.name "stemforge-ingest"
          git config user.email "stemforge-ingest@users.noreply.github.com"
          git add "ingested/${RECORD_AS}.json"
          git commit -m "Record recovered R2 upload for ${RECORD_AS} [skip ci]"
          git push || {
            git pull --rebase --autostash origin main
            git push
          }
