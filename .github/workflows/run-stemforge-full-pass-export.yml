name: Run StemForge Full Pass Export

on:
  push:
    branches:
      - main
    paths:
      - "full_pass_jobs/**/*.json"

permissions:
  contents: write
  actions: write

concurrency:
  group: stemforge-full-pass-export
  cancel-in-progress: false

jobs:
  full-pass-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUNPOD_ENDPOINT_ID: dyup1dztjr4u15
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve request metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          REQUEST="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^full_pass_jobs/.+\.json$' | head -n 1)"
          test -n "$REQUEST"
          NAME="$(basename "$REQUEST" .json)"
          ARTIFACT_NAME="$(jq -r '.artifact_name // "stemforge-full-pass"' "$REQUEST")"
          TAG="stemforge-full-pass-${GITHUB_RUN_ID}"
          echo "request=$REQUEST" >> "$GITHUB_OUTPUT"
          echo "request_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "output_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Wait for StemForge v2.1.0
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RUNPOD_API_KEY"
          PAYLOAD="$(mktemp)"
          printf '%s\n' '{"input":{"action":"system_info"}}' > "$PAYLOAD"
          READY=0
          for check in $(seq 1 40); do
            SUBMIT="$(mktemp)"
            RESULT="$(mktemp)"
            curl -sS --max-time 120 \
              -X POST "https://api.runpod.ai/v2/${RUNPOD_ENDPOINT_ID}/run" \
              -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
              -H "Content-Type: application/json" \
              --data-binary "@${PAYLOAD}" > "$SUBMIT"
            JOB_ID="$(jq -r '.id // empty' "$SUBMIT")"
            if [ -n "$JOB_ID" ]; then
              for attempt in $(seq 1 120); do
                curl -sS --max-time 120 \
                  "https://api.runpod.ai/v2/${RUNPOD_ENDPOINT_ID}/status/${JOB_ID}" \
                  -H "Authorization: Bearer ${RUNPOD_API_KEY}" > "$RESULT"
                STATE="$(jq -r '.status // empty' "$RESULT")"
                case "$STATE" in
                  COMPLETED) break ;;
                  FAILED|TIMED_OUT|CANCELLED) break ;;
                esac
                sleep 2
              done
              VERSION="$(jq -r '.output.stemforge_version // empty' "$RESULT")"
              FULL_PASS="$(jq -r '((.output.feature_groups.processing // []) | index("full_pass")) != null' "$RESULT")"
              MIDO="$(jq -r '.output.packages.mido // false' "$RESULT")"
              if [ "$VERSION" = "2.1.0" ] && [ "$FULL_PASS" = "true" ] && [ "$MIDO" = "true" ]; then
                READY=1
                rm -f "$SUBMIT" "$RESULT"
                break
              fi
            fi
            rm -f "$SUBMIT" "$RESULT"
            sleep 10
          done
          rm -f "$PAYLOAD"
          if [ "$READY" -ne 1 ]; then
            echo "StemForge v2.1.0 full-pass worker did not become active in time." >&2
            exit 1
          fi

      - name: Create temporary private release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.output_tag }}"
          TITLE="Temporary StemForge Full Pass ${GITHUB_RUN_ID}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "Temporary private output container for one StemForge v2.1 full pass."
          RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --jq ".[] | select(.name == \"$TITLE\") | .id" | head -n 1)"
          test -n "$RELEASE_ID"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Run live full-pass worker and export before shutdown
        shell: bash
        run: |
          set -euo pipefail
          REQUEST="${{ steps.meta.outputs.request }}"
          RELEASE_ID="${{ steps.release.outputs.release_id }}"
          mkdir -p fetched_output
          RUNTIME_PAYLOAD="$(mktemp)"
          RESULT_FILE="fetched_output/runpod_result.json"

          jq \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson release_id "$RELEASE_ID" \
            --arg token "$GH_TOKEN" \
            '.input.github_release_export = {repository:$repository, release_id:$release_id, token:$token}' \
            "$REQUEST" > "$RUNTIME_PAYLOAD"

          SUBMIT_FILE="$(mktemp)"
          curl -sS --max-time 120 \
            -X POST "https://api.runpod.ai/v2/${RUNPOD_ENDPOINT_ID}/run" \
            -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
            -H "Content-Type: application/json" \
            --data-binary "@${RUNTIME_PAYLOAD}" > "$SUBMIT_FILE"
          JOB_ID="$(jq -r '.id // empty' "$SUBMIT_FILE")"
          test -n "$JOB_ID"
          printf 'runpod_job_id=%s\n' "$JOB_ID" > fetched_output/RunPod_Execution.txt
          rm -f "$SUBMIT_FILE" "$RUNTIME_PAYLOAD"

          TERMINAL=0
          for attempt in $(seq 1 900); do
            curl -sS --max-time 120 \
              "https://api.runpod.ai/v2/${RUNPOD_ENDPOINT_ID}/status/${JOB_ID}" \
              -H "Authorization: Bearer ${RUNPOD_API_KEY}" > "$RESULT_FILE"
            STATE="$(jq -r '.status // empty' "$RESULT_FILE")"
            case "$STATE" in
              COMPLETED)
                TERMINAL=1
                break
                ;;
              FAILED|TIMED_OUT|CANCELLED)
                cat "$RESULT_FILE" >&2
                exit 1
                ;;
            esac
            sleep 5
          done
          test "$TERMINAL" -eq 1
          jq -e '.output.status == "completed" and .output.stemforge_version == "2.1.0" and .output.action == "full_pass"' "$RESULT_FILE" >/dev/null
          jq -e '.output.input_summary.stem_count == 8 and .output.input_summary.midi_file_count == 7' "$RESULT_FILE" >/dev/null
          jq -e '.output.candidates | length == 3' "$RESULT_FILE" >/dev/null

      - name: Download private release assets
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.output_tag }}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir fetched_output
          WAV_COUNT="$(find fetched_output -maxdepth 1 -type f -iname '*.wav' | wc -l)"
          test "$WAV_COUNT" -eq 3
          test -n "$(find fetched_output -maxdepth 1 -type f -name '*FullPass_Report.json' -print -quit)"
          test -n "$(find fetched_output -maxdepth 1 -type f -name '*mastering_report.json' -print -quit)"
          cp "${{ steps.meta.outputs.request }}" fetched_output/request.json
          sha256sum fetched_output/* > fetched_output/checksums.sha256
          find fetched_output -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload verified full-pass artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: fetched_output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Publish completion manifest
        shell: bash
        run: |
          set -euo pipefail
          NAME="${{ steps.meta.outputs.request_name }}"
          ARTIFACT_NAME="${{ steps.meta.outputs.artifact_name }}"
          MANIFEST="$(jq -n \
            --arg request "$NAME" \
            --arg artifact_name "$ARTIFACT_NAME" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg commit "$GITHUB_SHA" \
            '{request:$request,artifact_name:$artifact_name,run_id:$run_id,commit:$commit,status:"completed"}')"
          ENCODED="$(printf '%s' "$MANIFEST" | base64 -w0)"
          gh api --method PUT \
            "repos/${GITHUB_REPOSITORY}/contents/full_pass_manifests/${NAME}.json" \
            -f message="Complete StemForge full-pass export [skip ci]" \
            -f content="$ENCODED" \
            -f branch="main" >/dev/null

      - name: Remove temporary release
        if: always()
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.output_tag }}"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
