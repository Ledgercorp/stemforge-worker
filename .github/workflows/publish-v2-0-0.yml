name: Publish StemForge v2.0.0

on:
  push:
    branches:
      - main
    paths:
      - "release/v2.0.0.txt"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create v2.0.0 release from current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.0.0 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "v2.0.0 already exists."
            exit 0
          fi
          gh release create v2.0.0 \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "StemForge v2.0.0 Production Engine" \
            --notes "Adds secure transfer hooks, full-song analysis, stem integrity and null testing, Demucs separation, real mastering candidates, conservative repair and humanization, smarter lyric alignment, deterministic lyric-video rendering, DAW interchange, and structured production memory."
