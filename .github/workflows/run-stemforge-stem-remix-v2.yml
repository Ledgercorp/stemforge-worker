name: Run StemForge Stem Remix v2

on:
  push:
    branches: [main]
    paths:
      - "stem_remix_retry_jobs/**/*.json"

permissions:
  contents: write
  actions: write

concurrency:
  group: stemforge-stem-remix-v2
  cancel-in-progress: false

jobs:
  remix-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUNPOD_ENDPOINT_ID: dyup1dztjr4u15
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve request
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          REQUEST="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^stem_remix_retry_jobs/.+\.json$' | head -n 1)"
          test -n "$REQUEST"
          NAME="$(basename "$REQUEST" .json)"
          ARTIFACT_NAME="$(jq -r '.artifact_name // "stemforge-stem-remix"' "$REQUEST")"
          TAG="stemforge-stem-remix-v2-${GITHUB_RUN_ID}"
          TITLE="Temporary StemForge Stem Remix v2 ${GITHUB_RUN_ID}"
          echo "request=$REQUEST" >> "$GITHUB_OUTPUT"
          echo "request_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Verify live StemForge v2.2.0
        shell: bash
        run: |
          set -euo pipefail
          SUBMIT="$(mktemp)"
          RESULT="$(mktemp)"
          curl -sS --max-time 120 -X POST \
            "https://api.runpod.ai/v2/${RUNPOD_ENDPOINT_ID}/run" \
            -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
            -H "Content-Type: application/json" \
            --data '{"input":{"action":"system_info"}}' > "$SUBMIT"
          JOB_ID="$(jq -r '.id // empty' "$SUBMIT")"
          test -n "$JOB_ID"
          TERMINAL=0
          for attempt in $(seq 1 240); do
            curl -sS --max-time 120 \
              "https://api.runpod.ai/v2/${RUNPOD_ENDPOINT_ID}/status/${JOB_ID}" \
              -H "Authorization: Bearer ${RUNPOD_API_KEY}" > "$RESULT"
            STATE="$(jq -r '.status // empty' "$RESULT")"
            case "$STATE" in
              COMPLETED) TERMINAL=1; break ;;
              FAILED|TIMED_OUT|CANCELLED) cat "$RESULT" >&2; exit 1 ;;
            esac
            sleep 2
          done
          test "$TERMINAL" -eq 1
          jq -e '.output.stemforge_version == "2.2.0"' "$RESULT" >/dev/null
          jq -e '.output.build == "v2.2.0-stem-remix"' "$RESULT" >/dev/null
          jq -e '((.output.feature_groups.processing // []) | index("stem_remix")) != null' "$RESULT" >/dev/null
          rm -f "$SUBMIT" "$RESULT"

      - name: Create private output release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_JSON="$(jq -n \
            --arg tag "${{ steps.meta.outputs.tag }}" \
            --arg target "$GITHUB_SHA" \
            --arg name "${{ steps.meta.outputs.title }}" \
            --arg body "Temporary private output container for one live RunPod StemForge v2.2 stem remix." \
            '{tag_name:$tag,target_commitish:$target,name:$name,body:$body,draft:true,prerelease:false}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" --input -)"
          RELEASE_ID="$(printf '%s' "$RELEASE_JSON" | jq -r '.id // empty')"
          test -n "$RELEASE_ID"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Run live RunPod stem remix
        shell: bash
        run: |
          set -euo pipefail
          REQUEST="${{ steps.meta.outputs.request }}"
          RELEASE_ID="${{ steps.release.outputs.release_id }}"
          mkdir -p fetched_output
          RUNTIME="$(mktemp)"
          RESULT="fetched_output/RunPod_Stem_Remix_Result.json"
          jq \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson release_id "$RELEASE_ID" \
            --arg token "$GH_TOKEN" \
            '.input.github_release_export={repository:$repository,release_id:$release_id,token:$token}' \
            "$REQUEST" > "$RUNTIME"
          SUBMIT="$(mktemp)"
          curl -sS --max-time 120 -X POST \
            "https://api.runpod.ai/v2/${RUNPOD_ENDPOINT_ID}/run" \
            -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
            -H "Content-Type: application/json" \
            --data-binary "@${RUNTIME}" > "$SUBMIT"
          JOB_ID="$(jq -r '.id // empty' "$SUBMIT")"
          test -n "$JOB_ID"
          printf 'runpod_job_id=%s\n' "$JOB_ID" > fetched_output/RunPod_Execution.txt
          rm -f "$SUBMIT" "$RUNTIME"
          TERMINAL=0
          for attempt in $(seq 1 1000); do
            curl -sS --max-time 120 \
              "https://api.runpod.ai/v2/${RUNPOD_ENDPOINT_ID}/status/${JOB_ID}" \
              -H "Authorization: Bearer ${RUNPOD_API_KEY}" > "$RESULT"
            STATE="$(jq -r '.status // empty' "$RESULT")"
            case "$STATE" in
              COMPLETED) TERMINAL=1; break ;;
              FAILED|TIMED_OUT|CANCELLED) cat "$RESULT" >&2; exit 1 ;;
            esac
            sleep 5
          done
          test "$TERMINAL" -eq 1
          jq -e '.output.status == "completed"' "$RESULT" >/dev/null
          jq -e '.output.stemforge_version == "2.2.0" and .output.action == "stem_remix"' "$RESULT" >/dev/null
          jq -e '.output.input_summary.stem_count == 8 and .output.input_summary.midi_file_count == 7' "$RESULT" >/dev/null
          jq -e '.output.mixes | length == 2' "$RESULT" >/dev/null
          jq -e 'all(.output.mixes[]; .safety.accepted == true)' "$RESULT" >/dev/null

      - name: Download worker-rendered assets
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_ID="${{ steps.release.outputs.release_id }}"
          mkdir -p fetched_output
          ASSETS="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets")"
          COUNT="$(printf '%s' "$ASSETS" | jq 'length')"
          test "$COUNT" -eq 4
          printf '%s' "$ASSETS" | jq -r '.[] | [.id,.name] | @tsv' | while IFS=$'\t' read -r ASSET_ID NAME; do
            gh api \
              -H 'Accept: application/octet-stream' \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" > "fetched_output/${NAME}"
          done
          test "$(find fetched_output -maxdepth 1 -type f -iname '*.wav' | wc -l)" -eq 3
          test -n "$(find fetched_output -maxdepth 1 -type f -name '*Stem_Remix_Report.json' -print -quit)"
          cp "${{ steps.meta.outputs.request }}" fetched_output/request.json
          sha256sum fetched_output/* > fetched_output/SHA256SUMS.txt

      - name: Upload verified remix artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: fetched_output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Publish completion manifest
        shell: bash
        run: |
          set -euo pipefail
          NAME="${{ steps.meta.outputs.request_name }}"
          ARTIFACT_NAME="${{ steps.meta.outputs.artifact_name }}"
          MANIFEST="$(jq -n \
            --arg request "$NAME" \
            --arg artifact_name "$ARTIFACT_NAME" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg commit "$GITHUB_SHA" \
            '{request:$request,artifact_name:$artifact_name,run_id:$run_id,commit:$commit,status:"completed"}')"
          ENCODED="$(printf '%s' "$MANIFEST" | base64 -w0)"
          gh api --method PUT \
            "repos/${GITHUB_REPOSITORY}/contents/stem_remix_manifests/${NAME}.json" \
            -f message="Complete StemForge stem remix [skip ci]" \
            -f content="$ENCODED" \
            -f branch="main" >/dev/null

      - name: Remove temporary release
        if: always()
        shell: bash
        run: |
          RELEASE_ID="${{ steps.release.outputs.release_id }}"
          if [ -n "$RELEASE_ID" ]; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" || true
          fi
