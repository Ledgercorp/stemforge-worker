name: Run StemForge Stem Remix

on:
  push:
    branches: [main]
    paths:
      - "stem_remix_jobs/**/*.json"
      - "stem_remix_retry_jobs/**/*.json"
      - "stem_remix_retry_triggers/**/*.txt"

permissions:
  contents: write
  actions: write

concurrency:
  group: stemforge-stem-remix
  cancel-in-progress: false

jobs:
  remix-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUNPOD_ENDPOINT_ID: dyup1dztjr4u15
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve request
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          CHANGED="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
          REQUEST="$(printf '%s\n' "$CHANGED" | grep -E '^stem_remix_(retry_)?jobs/.+\.json$' | head -n 1 || true)"
          if [ -z "$REQUEST" ]; then
            TRIGGER="$(printf '%s\n' "$CHANGED" | grep -E '^stem_remix_retry_triggers/.+\.txt$' | head -n 1)"
            REQUEST="$(tr -d '\r\n' < "$TRIGGER")"
          fi
          test -f "$REQUEST"
          NAME="$(basename "$REQUEST" .json)"
          ARTIFACT_NAME="$(jq -r '.artifact_name // "stemforge-stem-remix"' "$REQUEST")"
          EXPECTED_STEMS="$(jq -r '.input.stems | length' "$REQUEST")"
          EXPECTED_MIDI="$(jq -r 'if .input.midi_zip_base64 or .input.midi_zip_url then 7 else 0 end' "$REQUEST")"
          TAG="stemforge-stem-remix-${GITHUB_RUN_ID}"
          echo "request=$REQUEST" >> "$GITHUB_OUTPUT"
          echo "request_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "expected_stems=$EXPECTED_STEMS" >> "$GITHUB_OUTPUT"
          echo "expected_midi=$EXPECTED_MIDI" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Wait for live StemForge v2.2.0
        shell: bash
        run: |
          set -euo pipefail
          READY=0
          for check in $(seq 1 50); do
            SUBMIT="$(mktemp)"; RESULT="$(mktemp)"
            curl -sS --max-time 120 -X POST \
              "https://api.runpod.ai/v2/${RUNPOD_ENDPOINT_ID}/run" \
              -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
              -H "Content-Type: application/json" \
              --data '{"input":{"action":"system_info"}}' > "$SUBMIT"
            JOB_ID="$(jq -r '.id // empty' "$SUBMIT")"
            if [ -n "$JOB_ID" ]; then
              for attempt in $(seq 1 180); do
                curl -sS --max-time 120 \
                  "https://api.runpod.ai/v2/${RUNPOD_ENDPOINT_ID}/status/${JOB_ID}" \
                  -H "Authorization: Bearer ${RUNPOD_API_KEY}" > "$RESULT"
                STATE="$(jq -r '.status // empty' "$RESULT")"
                case "$STATE" in COMPLETED|FAILED|TIMED_OUT|CANCELLED) break ;; esac
                sleep 2
              done
              VERSION="$(jq -r '.output.stemforge_version // empty' "$RESULT")"
              BUILD="$(jq -r '.output.build // empty' "$RESULT")"
              ACTION_READY="$(jq -r '((.output.feature_groups.processing // []) | index("stem_remix")) != null' "$RESULT")"
              if [ "$VERSION" = "2.2.0" ] && [ "$BUILD" = "v2.2.0-stem-remix" ] && [ "$ACTION_READY" = "true" ]; then READY=1; fi
            fi
            rm -f "$SUBMIT" "$RESULT"
            [ "$READY" -eq 1 ] && break
            sleep 10
          done
          test "$READY" -eq 1

      - name: Create temporary private output release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          TITLE="Temporary StemForge Stem Remix ${GITHUB_RUN_ID}"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "$TITLE" --notes "Temporary private output container for one RunPod stem remix."
          RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --jq ".[] | select(.name == \"$TITLE\") | .id" | head -n 1)"
          test -n "$RELEASE_ID"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Run live RunPod stem remix
        shell: bash
        run: |
          set -euo pipefail
          REQUEST="${{ steps.meta.outputs.request }}"
          RELEASE_ID="${{ steps.release.outputs.release_id }}"
          mkdir -p fetched_output
          RUNTIME="$(mktemp)"
          RESULT="fetched_output/RunPod_Stem_Remix_Result.json"
          jq --arg repository "$GITHUB_REPOSITORY" --argjson release_id "$RELEASE_ID" --arg token "$GH_TOKEN" \
            '.input.github_release_export={repository:$repository,release_id:$release_id,token:$token}' "$REQUEST" > "$RUNTIME"
          SUBMIT="$(mktemp)"
          curl -sS --max-time 120 -X POST \
            "https://api.runpod.ai/v2/${RUNPOD_ENDPOINT_ID}/run" \
            -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
            -H "Content-Type: application/json" \
            --data-binary "@${RUNTIME}" > "$SUBMIT"
          JOB_ID="$(jq -r '.id // empty' "$SUBMIT")"
          test -n "$JOB_ID"
          printf 'runpod_job_id=%s\n' "$JOB_ID" > fetched_output/RunPod_Execution.txt
          rm -f "$SUBMIT" "$RUNTIME"
          TERMINAL=0
          for attempt in $(seq 1 1000); do
            curl -sS --max-time 120 "https://api.runpod.ai/v2/${RUNPOD_ENDPOINT_ID}/status/${JOB_ID}" -H "Authorization: Bearer ${RUNPOD_API_KEY}" > "$RESULT"
            STATE="$(jq -r '.status // empty' "$RESULT")"
            case "$STATE" in COMPLETED) TERMINAL=1; break ;; FAILED|TIMED_OUT|CANCELLED) cat "$RESULT" >&2; exit 1 ;; esac
            sleep 5
          done
          test "$TERMINAL" -eq 1
          jq -e '.output.status == "completed"' "$RESULT" >/dev/null
          jq -e '.output.stemforge_version == "2.2.0" and .output.action == "stem_remix"' "$RESULT" >/dev/null
          jq -e --argjson n '${{ steps.meta.outputs.expected_stems }}' '.output.input_summary.stem_count == $n' "$RESULT" >/dev/null
          jq -e --argjson n '${{ steps.meta.outputs.expected_midi }}' '.output.input_summary.midi_file_count == $n' "$RESULT" >/dev/null
          jq -e '.output.mixes | length == 2' "$RESULT" >/dev/null
          jq -e 'all(.output.mixes[]; .safety.accepted == true)' "$RESULT" >/dev/null

      - name: Download worker-rendered assets
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir fetched_output
          test "$(find fetched_output -maxdepth 1 -type f -iname '*.wav' | wc -l)" -eq 3
          test -n "$(find fetched_output -maxdepth 1 -type f -name '*Stem_Remix_Report.json' -print -quit)"
          cp "${{ steps.meta.outputs.request }}" fetched_output/request.json
          sha256sum fetched_output/* > fetched_output/SHA256SUMS.txt

      - name: Upload verified remix artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: fetched_output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Publish completion manifest
        shell: bash
        run: |
          set -euo pipefail
          NAME="${{ steps.meta.outputs.request_name }}"
          MANIFEST="$(jq -n --arg request "$NAME" --arg artifact_name '${{ steps.meta.outputs.artifact_name }}' --argjson run_id "$GITHUB_RUN_ID" --arg commit "$GITHUB_SHA" '{request:$request,artifact_name:$artifact_name,run_id:$run_id,commit:$commit,status:"completed"}')"
          ENCODED="$(printf '%s' "$MANIFEST" | base64 -w0)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/stem_remix_manifests/${NAME}.json" -f message="Complete StemForge stem remix [skip ci]" -f content="$ENCODED" -f branch="main" >/dev/null

      - name: Remove temporary release
        if: always()
        shell: bash
        run: |
          gh release delete "${{ steps.meta.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
