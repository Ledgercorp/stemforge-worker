name: Verify StemForge Deployment

# The RunPod endpoint builds its image from this repository's GitHub source on
# the main branch. Nothing here builds or pushes a container image: RunPod does
# that itself, and automatic deploy-on-push is currently off, so a build is
# started by hand in the RunPod console.
#
# This workflow is the other half of that: it proves a release actually reached
# the live worker. Run it after triggering a build. It fails unless the live
# endpoint reports the exact expected identity and the full Naturalize and
# quality-gate contract.
#
# Uses the existing run-scoped RUNPOD_API_KEY, which works against
# api.runpod.ai/v2. It deliberately never calls rest.runpod.io/v1, which that
# key is not scoped for and which returns 401.

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: "stemforge_version the live worker must report"
        required: true
        default: "2.4.0"
        type: string
      expected_build:
        description: "build the live worker must report"
        required: true
        default: "v2.4.0-naturalize-balanced-vocoder"
        type: string
      wait_minutes:
        description: "How long to keep polling while the RunPod build rolls out"
        required: false
        default: "25"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: stemforge-verify-deployment
  cancel-in-progress: false

env:
  RUNPOD_ENDPOINT_ID: dyup1dztjr4u15

jobs:
  validate:
    name: Compile and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      STEMFORGE_WORKSPACE: ${{ runner.temp }}/stemforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install system audio tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-ci.txt
      - name: Compile worker
        run: python -m compileall -q app handler.py
      - name: Run regression tests
        run: python -m pytest -q
      - name: Validate relay request files
        run: python tools/validate_jobs.py
      - name: Assert the source declares the expected identity
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version || '2.4.0' }}
          EXPECTED_BUILD: ${{ inputs.expected_build || 'v2.4.0-naturalize-balanced-vocoder' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from app.system_v2 import VERSION, BUILD
          expected_version = os.environ["EXPECTED_VERSION"]
          expected_build = os.environ["EXPECTED_BUILD"]
          assert VERSION == expected_version, f"source VERSION {VERSION} != {expected_version}"
          assert BUILD == expected_build, f"source BUILD {BUILD} != {expected_build}"
          print(f"source identity OK: {VERSION} / {BUILD}")
          PY

  verify-live:
    name: Verify live worker
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      EXPECTED_VERSION: ${{ inputs.expected_version || '2.4.0' }}
      EXPECTED_BUILD: ${{ inputs.expected_build || 'v2.4.0-naturalize-balanced-vocoder' }}
      WAIT_MINUTES: ${{ inputs.wait_minutes || '25' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate secret
        run: |
          set -euo pipefail
          if [ -z "${RUNPOD_API_KEY}" ]; then
            echo "RUNPOD_API_KEY repository secret is missing." >&2
            exit 1
          fi

      - name: Poll live system_info until the identity matches
        id: probe
        run: |
          set -euo pipefail
          mkdir -p deployment_records
          DEADLINE=$(( $(date +%s) + WAIT_MINUTES * 60 ))
          ATTEMPT=0

          while :; do
            ATTEMPT=$((ATTEMPT + 1))
            SUBMIT="$(curl --fail --silent --show-error \
              --request POST "https://api.runpod.ai/v2/${RUNPOD_ENDPOINT_ID}/run" \
              -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
              -H "Content-Type: application/json" \
              --data '{"input":{"action":"system_info"},"policy":{"ttl":600000,"executionTimeout":300000}}')"
            JOB_ID="$(printf '%s' "$SUBMIT" | jq -r '.id // empty')"
            test -n "$JOB_ID"

            STATE=""
            for _ in $(seq 1 60); do
              sleep 5
              curl --fail --silent --show-error \
                "https://api.runpod.ai/v2/${RUNPOD_ENDPOINT_ID}/status/${JOB_ID}" \
                -H "Authorization: Bearer ${RUNPOD_API_KEY}" > /tmp/status.json
              STATE="$(jq -r '.status // empty' /tmp/status.json)"
              case "$STATE" in COMPLETED|FAILED|TIMED_OUT|CANCELLED) break ;; esac
            done

            LIVE_VERSION="$(jq -r '.output.stemforge_version // empty' /tmp/status.json)"
            LIVE_BUILD="$(jq -r '.output.build // empty' /tmp/status.json)"
            echo "attempt ${ATTEMPT}: state=${STATE} version=${LIVE_VERSION:-none} build=${LIVE_BUILD:-none}"

            if [ "$LIVE_VERSION" = "${EXPECTED_VERSION}" ] && [ "$LIVE_BUILD" = "${EXPECTED_BUILD}" ]; then
              break
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "Live worker never reported ${EXPECTED_VERSION} / ${EXPECTED_BUILD} within ${WAIT_MINUTES} minutes." >&2
              echo "Confirm a RunPod build was triggered and finished, then re-run." >&2
              cp /tmp/status.json deployment_records/live-system-info.json
              exit 1
            fi
            sleep 30
          done

          cp /tmp/status.json deployment_records/live-system-info.json
          echo "verification_job_id=${JOB_ID}" >> "$GITHUB_OUTPUT"

      - name: Assert the release contract
        run: |
          set -euo pipefail
          # Any mismatch fails the verification. These are the release
          # acceptance criteria, not advisory checks.
          jq -e '
            .status == "COMPLETED"
            and .output.status == "completed"
            and .output.action == "system_info"
            and .output.naturalize.default_intensity == 1.0
            and .output.naturalize.preset == "Naturalize Balanced"
            and .output.naturalize.maximum_full_passes == 2
            and .output.naturalize.second_pass_maximum_intensity_scale == 0.70
            and .output.naturalize.denoise_constraints.position == "post_cocktail_only"
            and .output.quality_gates.automatic_intensity_reduction == true
            and .output.quality_gates.vocoder_fallback_to_dsp == true
            and .output.reliability_guards.lazy_optional_vocoder_imports == true
          ' deployment_records/live-system-info.json > /dev/null
          echo "Release contract satisfied."

      - name: Summarize the deployment
        run: |
          set -euo pipefail
          RECORD=deployment_records/live-system-info.json
          {
            echo "### Live verification"
            echo ""
            echo "- endpoint: \`${RUNPOD_ENDPOINT_ID}\`"
            echo "- source commit on main: \`${GITHUB_SHA}\`"
            echo "- verification job: \`${{ steps.probe.outputs.verification_job_id }}\`"
            echo "- live version: \`$(jq -r '.output.stemforge_version' "$RECORD")\`"
            echo "- live build: \`$(jq -r '.output.build' "$RECORD")\`"
            echo "- verified at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "Backend availability reported by the live worker:"
            jq -r '.output.packages | to_entries[]
                   | select(.key | test("vocos|bigvgan|discoder|torch|demucs|whisperx"))
                   | "- \(.key): \(.value)"' "$RECORD"
            echo ""
            echo "Executables:"
            jq -r '.output.executables | to_entries[] | "- \(.key): \(.value)"' "$RECORD"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stemforge-deployment-${{ github.run_id }}
          path: deployment_records/
          retention-days: 90
