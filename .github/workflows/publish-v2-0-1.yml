name: Publish StemForge v2.0.1

on:
  push:
    branches:
      - main
    paths:
      - "release/v2.0.1.txt"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create v2.0.1 release from current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.0.1 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "v2.0.1 already exists."
            exit 0
          fi
          gh release create v2.0.1 \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "StemForge v2.0.1 Volume Transfer Bridge" \
            --notes "Adds verified chunked transfer to and from the RunPod network volume for lossless processing before private S3 storage is configured."
